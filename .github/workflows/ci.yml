name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:

# Every step below is a gate: a lint error, Convex type error, failing test or
# broken build fails the job and blocks the merge.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check Convex (functions and tests)
        run: npx tsc --noEmit -p convex
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://example.convex.site
          NEXT_PUBLIC_APP_NAME: Fish Farm Management
