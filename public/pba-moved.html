<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <title>PBA Farm has moved to Anowa</title>
  <link rel="icon" href="/brand/anowa-app-icon.svg">
  <style>
    @font-face {font-family:Inter;src:url('/fonts/inter-latin-wght-normal.woff2')}
    @font-face {font-family:Instrument;src:url('/fonts/instrument-serif-latin-400-normal.woff2')}
    * {box-sizing:border-box}
    body {margin:0;background:#f7f4ed;color:#182a26;font:1rem/1.55 Inter,Arial,sans-serif}
    .page {max-width:1480px;margin:auto;padding:clamp(20px,5vw,80px)}
    header {display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid #c7cdc2}
    header img {width:128px;height:auto} header span {font-weight:550;color:#42564c}
    main {display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:6vw;padding:clamp(42px,8vh,110px) 0}
    h1 {font:400 clamp(4rem,7.8vw,8rem)/.94 Instrument,Georgia,serif;letter-spacing:-.048em;margin:0 0 28px}
    p {font-size:clamp(1rem,1.5vw,1.25rem);max-width:40ch;color:#42564c;margin:0 0 32px}
    a {display:inline-flex;align-items:center;gap:25px;padding:15px 23px;background:#173c33;color:white;border-radius:8px;text-decoration:none;font-weight:600}
    a:hover {background:#235849} a:focus-visible {outline:3px solid #a94219;outline-offset:4px}
    small {display:block;margin-top:10px;color:#4f6258}
    .water {position:relative;isolation:isolate;overflow:hidden;aspect-ratio:1 / 1.02;border-radius:48% 48% 12px 12px;background:radial-gradient(ellipse at 24% 16%,#487e69,transparent 62%),#153c35;display:grid;place-items:center}
    .water::before {content:'';position:absolute;inset:-45%;z-index:-1;background:repeating-radial-gradient(ellipse at 50% 76%,transparent 0 18px,#aad5ad40 19px,transparent 20px 28px);transform:rotate(-22deg)}
    .fish {width:52%;height:auto;overflow:visible;filter:drop-shadow(0 8px 16px #163e33);animation:swim 5s ease-in-out infinite}
    .pulse {stroke-dasharray:160;animation:draw 1.8s ease-out both}
    @keyframes draw {from {stroke-dashoffset:160} to {stroke-dashoffset:0}}
    @keyframes swim {50% {transform:translate(4px,-7px) rotate(-2deg)}}
    @media(max-width:740px){main{grid-template-columns:1fr;gap:32px}.water{aspect-ratio:2.2;border-radius:90px 90px 8px 8px}.fish{width:30%}h1{font-size:clamp(3.5rem,13vw,5rem)}header img{width:110px}}
    @media(prefers-reduced-motion:reduce){.fish,.pulse{animation:none}}
  </style>
</head>
<body><div class="page">
  <header><img src="/brand/anowa-lockup-light.svg" alt="Anowa"><span>PBA Farm</span></header>
  <main>
    <section aria-labelledby="move-title">
      <h1 id="move-title">PBA Farm<br>has moved.</h1>
      <p>Your farm workspace is now on Anowa. Sign in with the same credentials you already use for PBA Farm.</p>
      <a href="https://app.getanowa.com/">Continue to Anowa <span aria-hidden="true">↗</span></a>
      <small>app.getanowa.com</small>
    </section>
    <div class="water" aria-hidden="true">
      <svg class="fish" viewBox="0 13 62 42" fill="none"><path class="pulse" d="M14.5 34 H18 L23 19 L30 49 L36 27 L40 34 H46 L58 22 L58 46 L46 34" stroke="#f4f1db" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4.5" cy="34" r="4" fill="#F2A07B"/></svg>
    </div>
  </main>
</div></body></html>
